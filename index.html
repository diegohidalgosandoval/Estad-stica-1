<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Estadística 1 · UDEP Lima · 2026-I</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Karla:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root, [data-theme="light"] {
    --paper:        #fdfaf3;
    --paper-soft:   #faf6ec;
    --cream-light:  #faf6ec;
    --navy:         #1a2845;
    --navy-soft:    #4a5d80;
    --burgundy:     #722f37;
    --gold:         #b08d4f;
    --gray-warm:    #6b6453;
    --gray-soft:    #a59c87;
    --line:         #d4ccb8;
    --shadow-soft:  0 4px 20px rgba(26, 40, 69, 0.06);
    --shadow-hover: 0 12px 36px rgba(26, 40, 69, 0.12);
  }
  [data-theme="dark"] {
    --paper:        #0f1626;
    --paper-soft:   #131c30;
    --cream-light:  #1f2a42;
    --navy:         #f0e9d6;
    --navy-soft:    #c4baa3;
    --burgundy:     #d68891;
    --gold:         #d4b075;
    --gray-warm:    #a89e87;
    --gray-soft:    #7a7160;
    --line:         #2a3450;
    --shadow-soft:  0 4px 20px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 12px 36px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Karla', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--navy);
    line-height: 1.6;
    min-height: 100vh;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

  /* ─── Theme toggle ─── */
  .theme-toggle {
    position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--paper-soft); border: 1px solid var(--line);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--navy); transition: all 0.3s ease; box-shadow: var(--shadow-soft);
  }
  .theme-toggle:hover {
    transform: scale(1.08) rotate(15deg);
    background: var(--cream-light); border-color: var(--gold); color: var(--gold);
  }
  .theme-toggle svg { width: 20px; height: 20px; position: absolute; transition: opacity 0.3s, transform 0.4s; }
  [data-theme="light"] .icon-moon { opacity: 1; transform: rotate(0deg); }
  [data-theme="light"] .icon-sun  { opacity: 0; transform: rotate(-90deg); }
  [data-theme="dark"]  .icon-moon { opacity: 0; transform: rotate(90deg); }
  [data-theme="dark"]  .icon-sun  { opacity: 1; transform: rotate(0deg); }

  /* ─── Hero ─── */
  .hero {
    text-align: center; padding: 6rem 2rem 4rem;
    background: linear-gradient(180deg, var(--paper-soft) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--line);
    transition: background 0.4s, border-color 0.4s;
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1.5rem;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 500;
    line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 1rem;
  }
  .hero-title em { font-style: italic; color: var(--burgundy); font-weight: 500; }
  .hero-divider {
    width: 80px; height: 1px; background: var(--gold);
    margin: 2rem auto; position: relative;
  }
  .hero-divider::before, .hero-divider::after {
    content: ''; position: absolute; top: 50%;
    width: 6px; height: 6px; background: var(--gold);
    border-radius: 50%; transform: translateY(-50%);
  }
  .hero-divider::before { left: -20px; }
  .hero-divider::after  { right: -20px; }
  .hero-meta {
    font-family: 'Cormorant Garamond', serif; font-size: 1.25rem;
    color: var(--gray-warm); font-style: italic; margin-bottom: 0.5rem;
  }
  .hero-meta-secondary {
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    color: var(--gray-soft); letter-spacing: 0.1em; margin-top: 1rem;
  }

  /* ─── Estados ─── */
  .state-box { padding: 5rem 2rem; text-align: center; }
  .state-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1rem;
  }
  .state-title {
    font-family: 'Cormorant Garamond', serif; font-size: 1.75rem;
    color: var(--navy); margin-bottom: 1rem; font-weight: 500;
  }
  .state-message {
    font-size: 0.95rem; color: var(--gray-warm);
    max-width: 600px; margin: 0 auto; line-height: 1.7;
  }
  .state-code {
    display: inline-block; font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; background: var(--cream-light); color: var(--burgundy);
    padding: 0.2rem 0.5rem; border-radius: 3px; border: 1px solid var(--line);
  }
  .loading-pulse {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); margin: 0 4px; animation: pulse 1.4s ease-in-out infinite;
  }
  .loading-pulse:nth-child(2) { animation-delay: 0.2s; }
  .loading-pulse:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ─── Secciones ─── */
  .section { padding: 4rem 2rem 1rem; }
  .section-header {
    display: flex; align-items: baseline; gap: 1.5rem;
    margin-bottom: 2rem; padding-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }
  .section-count {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.2em; color: var(--gray-soft);
    background: var(--paper-soft); padding: 0.3rem 0.7rem;
    border-radius: 20px; border: 1px solid var(--line);
  }
  .section-eyebrow {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 0.4rem;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif; font-size: 2rem;
    font-weight: 500; color: var(--navy); line-height: 1.2;
  }
  .section-title em { font-style: italic; color: var(--burgundy); }

  /* ─── Grid de cards ─── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 3px; padding: 1.5rem 1.5rem 1.25rem;
    text-decoration: none; color: inherit;
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; min-height: 140px;
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--gold);
    transform: scaleY(0); transform-origin: top;
    transition: transform 0.4s ease;
  }
  .card:hover {
    border-color: var(--navy-soft); background: var(--cream-light);
    transform: translateY(-2px); box-shadow: var(--shadow-hover);
  }
  .card:hover::before { transform: scaleY(1); }
  .card-title {
    font-family: 'Cormorant Garamond', serif; font-size: 1.2rem;
    font-weight: 600; color: var(--navy); line-height: 1.3;
    margin-bottom: 0.5rem;
  }
  .card-filename {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    color: var(--gray-soft); margin-bottom: 0.75rem;
    word-break: break-all; opacity: 0.75; flex: 1;
  }
  .card-arrow {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 0.9rem; color: var(--gold);
    display: inline-flex; align-items: center; gap: 0.4rem;
    transition: gap 0.3s, color 0.3s;
  }
  .card:hover .card-arrow { gap: 0.7rem; color: var(--burgundy); }

  /* ─── Footer ─── */
  .footer {
    margin-top: 5rem; padding: 3rem 2rem; text-align: center;
    border-top: 1px solid var(--line); background: var(--paper-soft);
    transition: background 0.4s, border-color 0.4s;
  }
  .footer-divider { width: 40px; height: 1px; background: var(--gold); margin: 0 auto 1.5rem; }
  .footer-text {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1rem; color: var(--gray-warm); margin-bottom: 0.5rem;
  }
  .footer-meta {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.2em; color: var(--gray-soft); text-transform: uppercase;
  }
  .footer-link {
    color: var(--gold); text-decoration: none; cursor: pointer;
    border-bottom: 1px solid transparent; transition: border-color 0.3s;
  }
  .footer-link:hover { border-bottom-color: var(--gold); }

  @media (max-width: 768px) {
    .hero { padding: 4rem 1.5rem 3rem; }
    .container { padding: 0 1.25rem; }
    .theme-toggle { top: 1rem; right: 1rem; }
    .section-header { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    .section-title { font-size: 1.6rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Theme toggle -->
<button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
    <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
    <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
  </svg>
</button>

<!-- Hero -->
<header class="hero">
  <div class="container">
    <div class="hero-eyebrow">Biblioteca académica</div>
    <h1 class="hero-title">Estadística <em>I</em></h1>
    <div class="hero-divider"></div>
    <p class="hero-meta">Universidad de Piura · Campus Lima</p>
    <p class="hero-meta-secondary">2026 – I &nbsp;·&nbsp; Prof. Hugo Agurto</p>
  </div>
</header>

<!-- Contenido dinámico -->
<main id="library-content">
  <div class="state-box">
    <div class="state-eyebrow">
      Cargando
      <span class="loading-pulse"></span><span class="loading-pulse"></span><span class="loading-pulse"></span>
    </div>
    <p class="state-title">Buscando archivos en el repositorio</p>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-divider"></div>
    <p class="footer-text">Biblioteca de estudio personal — Pingüino</p>
    <p class="footer-meta">
      Estadística I · UDEP Lima · 2026 – I
      &nbsp;·&nbsp;
      <a class="footer-link" id="refresh-link">Refrescar ahora</a>
    </p>
  </div>
</footer>

<script>
/* ════════════════════════════════════════════════
   CONFIGURACIÓN
   ════════════════════════════════════════════════ */
const OWNER  = 'diegohidalgosandoval';
const REPO   = 'Estad-stica-1';
const BRANCHES_TO_TRY = ['main', 'master'];

/* ════════════════════════════════════════════════
   THEME TOGGLE (modo oscuro)
   ════════════════════════════════════════════════ */
(function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
})();

/* ════════════════════════════════════════════════
   BIBLIOTECA — listar TODOS los archivos
   ════════════════════════════════════════════════ */
const container = document.getElementById('library-content');

async function loadLibrary() {
  showLoading();
  try {
    const files = await fetchAllHtmlFiles();
    if (files.length === 0) {
      showEmpty();
      return;
    }
    const groups = groupByFolder(files);
    render(groups, files.length);
  } catch (err) {
    showError(err);
  }
}

async function fetchAllHtmlFiles() {
  let lastError = null;
  for (const branch of BRANCHES_TO_TRY) {
    try {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${branch}?recursive=1`;
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) { lastError = new Error(`HTTP ${res.status}`); continue; }
      const data = await res.json();
      return data.tree
        .filter(item => item.type === 'blob')
        .filter(item => item.path.toLowerCase().endsWith('.html'))
        .filter(item => item.path.toLowerCase() !== 'index.html')
        .map(item => item.path);
    } catch (e) { lastError = e; }
  }
  throw lastError || new Error('No se pudo conectar con GitHub');
}

function groupByFolder(paths) {
  const groups = {};
  paths.forEach(path => {
    const parts = path.split('/');
    const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : '__root__';
    if (!groups[folder]) groups[folder] = [];
    groups[folder].push(path);
  });
  Object.values(groups).forEach(arr => arr.sort());
  return groups;
}

function render(groups, total) {
  const sortedFolders = Object.keys(groups).sort((a, b) => {
    if (a === '__root__') return -1;
    if (b === '__root__') return 1;
    return a.localeCompare(b, 'es', { numeric: true });
  });

  let html = '';
  sortedFolders.forEach(folder => {
    const files = groups[folder];
    html += renderSection(folder, files);
  });

  html += `
    <div style="text-align:center; padding:2rem; font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--gray-soft); letter-spacing:0.15em;">
      ${total} archivo${total !== 1 ? 's' : ''} en total
    </div>`;

  container.innerHTML = html;
}

function renderSection(folder, files) {
  const isRoot = folder === '__root__';
  const eyebrow = isRoot ? 'Raíz del repositorio' : `Carpeta: ${folder}`;
  const title = isRoot ? 'General' : beautifyFolderName(folder);

  const cards = files.map(path => {
    const filename = path.split('/').pop();
    const title = beautifyFileName(filename);
    return `
      <a href="${path}" class="card">
        <h3 class="card-title">${title}</h3>
        <p class="card-filename">${path}</p>
        <span class="card-arrow">Abrir →</span>
      </a>`;
  }).join('');

  return `
    <section class="section">
      <div class="container">
        <div class="section-header">
          <div style="flex:1;">
            <div class="section-eyebrow">${eyebrow}</div>
            <h2 class="section-title">${title}</h2>
          </div>
          <div class="section-count">${files.length} archivo${files.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="grid">${cards}</div>
      </div>
    </section>`;
}

function beautifyFileName(filename) {
  return filename
    .replace(/\.html$/i, '')
    .replace(/[_-]+/g, ' ')
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}

function beautifyFolderName(folder) {
  // Si la carpeta es "cap1", "cap2", etc., convertir a "Capítulo 1"
  const capMatch = folder.match(/^cap(?:itulo)?[_-]?(\d+)$/i);
  if (capMatch) return `Capítulo ${capMatch[1]}`;
  return folder
    .replace(/[_-]+/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function showLoading() {
  container.innerHTML = `
    <div class="state-box">
      <div class="state-eyebrow">
        Cargando
        <span class="loading-pulse"></span><span class="loading-pulse"></span><span class="loading-pulse"></span>
      </div>
      <p class="state-title">Buscando archivos en el repositorio</p>
    </div>`;
}

function showEmpty() {
  container.innerHTML = `
    <div class="state-box">
      <div class="state-eyebrow">Sin archivos</div>
      <p class="state-title">El repositorio está vacío</p>
      <p class="state-message">No se encontraron archivos <span class="state-code">.html</span> en el repositorio (aparte de index.html). Sube tus materiales y refresca.</p>
    </div>`;
}

function showError(err) {
  container.innerHTML = `
    <div class="state-box">
      <div class="state-eyebrow">Atención</div>
      <p class="state-title">No se pudo cargar la biblioteca</p>
      <p class="state-message">
        Error: <span class="state-code">${err.message}</span><br><br>
        Si dice 404, verifica que el repositorio sea <strong>público</strong> y que el nombre sea exacto.<br>
        Si dice 403, esperaste el rate limit de GitHub (60 consultas/hora).<br>
        Si lo abriste con doble-click en tu disco, sube los archivos a GitHub Pages para que funcione.
      </p>
    </div>`;
}

/* Inicializar */
document.addEventListener('DOMContentLoaded', () => {
  loadLibrary();
  document.getElementById('refresh-link').addEventListener('click', (e) => {
    e.preventDefault();
    loadLibrary();
  });
});
</script>

</body>
</html>
